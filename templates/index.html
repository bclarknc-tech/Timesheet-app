<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Entry</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        select, input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input[type="date"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; cursor: pointer; }
        input[type="date"]:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.1); }
        button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0052a3; }
        .success { color: green; margin-top: 10px; }
        .error { color: red; margin-top: 10px; }
        .hours-note { font-size: 12px; color: #888; margin-top: 5px; }
        .description-note { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Timesheet Entry</h1>
        <form id="timesheetForm">
            <div class="form-group">
                <label for="employee">Employee Name</label>
                <select id="employee" name="employee_name" required>
                    <option value="">-- Select Employee --</option>
                    <option value="Brian Clark">Brian Clark</option>
                    <option value="Rolfe Haigler">Rolfe Haigler</option>
                    <option value="Dylan Williams">Dylan Williams</option>
                </select>
            </div>

            <div class="form-group">
                <label for="job">Job</label>
                <select id="job" name="job_number" required>
                    <option value="">-- Select Job --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date Worked</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="hours">Hours (in quarter increments)</label>
                <input type="number" id="hours" name="hours" step="0.25" min="0.25" required>
                <div class="hours-note">Enter values like 0.25, 0.5, 0.75, 1.0, etc.</div>
            </div>

            <div class="form-group">
                <label for="description">Work Description</label>
                <textarea id="description" name="description" placeholder="Enter each item on a new line - they will be bulleted" required></textarea>
                <div class="description-note">Press Enter for each new item (will be converted to bullets)</div>
                <div id="preview" style="margin-top: 10px; padding: 10px; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 4px; white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 13px; min-height: 40px; color: #666;"></div>
            </div>

            <button type="submit">Submit Timesheet</button>
            <div id="message"></div>
        </form>
    </div>

    <script>
        let jobs = [];

        fetch('/api/jobs')
            .then(r => r.json())
            .then(data => {
                jobs = data;
                const select = document.getElementById('job');
                jobs.forEach(job => {
                    const opt = document.createElement('option');
                    opt.value = job.number;
                    opt.textContent = job.number + ' - ' + job.name;
                    select.appendChild(opt);
                });
            });

        document.getElementById('description').addEventListener('input', (e) => {
            const lines = e.target.value
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map(line => '• ' + line)
                .join('\n');
            document.getElementById('preview').textContent = lines || '(preview will appear here)';
        });

        document.getElementById('timesheetForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const form = e.target;
            const job = jobs.find(j => j.number === form.job_number.value);

            const descriptionLines = form.description.value
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map(line => '• ' + line)
                .join('\n');

            const data = {
                employee_name: form.employee_name.value,
                job_number: form.job_number.value,
                job_name: job ? job.name : '',
                date: form.date.value,
                hours: form.hours.value,
                description: descriptionLines
            };

            fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(result => {
                const msg = document.getElementById('message');
                if (result.success) {
                    msg.textContent = 'Timesheet submitted successfully!';
                    msg.className = 'success';
                    form.reset();
                } else {
                    msg.textContent = 'Error: ' + result.error;
                    msg.className = 'error';
                }
            });
        });
    </script>
</body>
</html>
