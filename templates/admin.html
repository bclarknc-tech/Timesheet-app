<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
        .container { width: 95%; max-width: 1400px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; color: #333; }
        .filters { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filters input, .filters select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .filters button { padding: 8px 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .filters button:hover { background: #0052a3; }
        .print-btn { padding: 8px 16px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .print-btn:hover { background: #5a6268; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; border: 1px solid #000; }
        th { background: #f0f0f0; padding: 12px; text-align: left; border: 1px solid #000; font-weight: 600; white-space: nowrap; }
        td { padding: 12px; border: 1px solid #000; }
        td:nth-child(6) { white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 13px; }
        tr:hover { background: #fafafa; }
        .bill-btn { padding: 6px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px; }
        .bill-btn.billed { background: #6c757d; }
        .bill-btn:hover { opacity: 0.9; }
        .delete-btn { padding: 6px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { opacity: 0.9; }
        .report-section { margin-top: 30px; padding-top: 30px; border-top: 2px solid #eee; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .unbilled { background: #fff3cd; color: #856404; }
        .billed { background: #d4edda; color: #155724; }
        .totals { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 4px; }
        .group-header { background: #e8f4f8 !important; font-weight: bold !important; padding: 12px !important; }
        .filters select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .print-preview { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 1000; overflow-y: auto; }
        .print-preview.active { display: block; }
        .print-preview-content { max-width: 8.5in; margin: 0.5in auto; padding: 0.5in; background: white; }
        .print-preview-header { text-align: center; margin-bottom: 20px; }
        .print-preview-header h2 { margin-bottom: 10px; }
        .print-close { position: fixed; top: 10px; right: 10px; padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 1001; }
        .print-close:hover { background: #c82333; }
        @media print {
            body { background: white; }
            .container { width: 100%; max-width: 100%; box-shadow: none; margin: 0; padding: 0; }
            .filters, .print-btn { display: none; }
            .table-wrapper { overflow-x: visible; }
            table { page-break-inside: avoid; }
            tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Timesheet Admin</h1>

        <div class="filters">
            <select id="employeeFilter">
                <option value="">All Employees</option>
                <option value="Brian Clark">Brian Clark</option>
                <option value="Rolfe Haigler">Rolfe Haigler</option>
                <option value="Dylan Williams">Dylan Williams</option>
            </select>
            <input type="text" id="jobFilter" placeholder="Job Number">
            <input type="date" id="startDate" placeholder="Start Date">
            <input type="date" id="endDate" placeholder="End Date">
            <label>
                <input type="checkbox" id="unbilledOnly">
                Unbilled Only
            </label>
            <select id="reportType">
                <option value="flat">Flat List</option>
                <option value="by_employee">Group by Employee</option>
                <option value="by_job">Group by Job</option>
                <option value="by_date">Group by Date</option>
            </select>
            <button onclick="generateReport()">Generate Report</button>
            <button class="print-btn" onclick="showPrintPreview()">Print Preview</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Job #</th>
                        <th>Job Name</th>
                        <th>Hours</th>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="entries"></tbody>
            </table>
        </div>

        <div class="report-section">
            <h2>Report Summary</h2>
            <div class="totals">
                <p><strong>Total Hours:</strong> <span id="totalHours">0</span></p>
                <p><strong>Total Entries:</strong> <span id="totalEntries">0</span></p>
            </div>
        </div>
    </div>

    <div class="print-preview" id="printPreview">
        <button class="print-close" onclick="closePrintPreview()">Close Preview</button>
        <div class="print-preview-content">
            <div class="print-preview-header">
                <h2>Timesheet Report</h2>
                <p id="printDate"></p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Job #</th>
                        <th>Job Name</th>
                        <th>Hours</th>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="printEntries"></tbody>
            </table>
            <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #ddd;">
                <p><strong>Total Hours:</strong> <span id="printTotalHours">0</span></p>
                <p><strong>Total Entries:</strong> <span id="printTotalEntries">0</span></p>
            </div>
            <div style="margin-top: 40px; text-align: center;">
                <button class="print-btn" onclick="window.print()">Print</button>
            </div>
        </div>
    </div>

    <script>
        function loadEntries() {
            generateReport();
        }

        function generateReport() {
            const employee = document.getElementById('employeeFilter').value;
            const job = document.getElementById('jobFilter').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const unbilled = document.getElementById('unbilledOnly').checked;
            const reportType = document.getElementById('reportType').value;

            let url = '/api/report?';
            if (employee) url += 'employee_name=' + encodeURIComponent(employee) + '&';
            if (job) url += 'job_number=' + encodeURIComponent(job) + '&';
            if (start) url += 'start_date=' + start + '&';
            if (end) url += 'end_date=' + end + '&';
            if (unbilled) url += 'unbilled_only=true&';
            url += 'report_type=' + reportType + '&';

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    const tbody = document.getElementById('entries');
                    tbody.innerHTML = '';

                    if (data.report_type === 'flat') {
                        renderFlatReport(data.entries, tbody);
                    } else if (data.grouped) {
                        renderGroupedReport(data.grouped, data.report_type, tbody);
                    }

                    document.getElementById('totalHours').textContent = data.total_hours;
                    document.getElementById('totalEntries').textContent = data.entries.length;
                });
        }

        function renderFlatReport(entries, tbody) {
            entries.forEach(entry => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${entry.employee}</td>
                    <td>${entry.job_number}</td>
                    <td>${entry.job_name}</td>
                    <td>${entry.hours}</td>
                    <td>${entry.date}</td>
                    <td>${entry.description}</td>
                    <td>
                        <span class="status-badge ${entry.is_billed ? 'billed' : 'unbilled'}">
                            ${entry.is_billed ? 'BILLED' : 'UNBILLED'}
                        </span>
                    </td>
                    <td>
                        <button class="bill-btn ${entry.is_billed ? 'billed' : ''}" onclick="toggleBill(${entry.id})">
                            ${entry.is_billed ? 'Mark UNBILLED' : 'Mark BILLED'}
                        </button>
                        <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                    </td>
                `;
            });
        }

        function renderGroupedReport(grouped, reportType, tbody) {
            const labels = {
                'by_employee': 'Employee',
                'by_job': 'Job',
                'by_date': 'Date'
            };
            const label = labels[reportType] || 'Group';

            Object.keys(grouped).sort().forEach(key => {
                const group = grouped[key];
                const row = tbody.insertRow();
                row.innerHTML = `<td colspan="8" style="background: #e8f4f8; font-weight: bold; padding-top: 15px; padding-bottom: 15px;">
                    ${label}: ${reportType === 'by_job' ? key + ' - ' + group.job_name : key} | Hours: ${group.total_hours}
                </td>`;

                group.entries.forEach(entry => {
                    const dataRow = tbody.insertRow();
                    dataRow.innerHTML = `
                        <td>${entry.employee}</td>
                        <td>${entry.job_number}</td>
                        <td>${entry.job_name}</td>
                        <td>${entry.hours}</td>
                        <td>${entry.date}</td>
                        <td>${entry.description}</td>
                        <td>
                            <span class="status-badge ${entry.is_billed ? 'billed' : 'unbilled'}">
                                ${entry.is_billed ? 'BILLED' : 'UNBILLED'}
                            </span>
                        </td>
                        <td>
                            <button class="bill-btn ${entry.is_billed ? 'billed' : ''}" onclick="toggleBill(${entry.id})">
                                ${entry.is_billed ? 'Mark UNBILLED' : 'Mark BILLED'}
                            </button>
                            <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                        </td>
                    `;
                });
            });
        }

        function toggleBill(entryId) {
            fetch(`/api/toggle-bill/${entryId}`, { method: 'POST' })
                .then(r => r.json())
                .then(result => {
                    if (result.success) {
                        generateReport();
                    }
                });
        }

        function deleteEntry(entryId) {
            if (confirm('Are you sure you want to delete this timesheet entry?')) {
                fetch(`/api/delete/${entryId}`, { method: 'DELETE' })
                    .then(r => r.json())
                    .then(result => {
                        if (result.success) {
                            generateReport();
                        } else {
                            alert('Error deleting entry: ' + result.error);
                        }
                    });
            }
        }

        function updateTotals(entries) {
            const totalHours = entries.reduce((sum, e) => sum + e.hours, 0);
            document.getElementById('totalHours').textContent = totalHours;
            document.getElementById('totalEntries').textContent = entries.length;
        }

        function showPrintPreview() {
            const printEntries = document.getElementById('printEntries');
            const entries = document.getElementById('entries');

            printEntries.innerHTML = entries.innerHTML;

            const totalHours = document.getElementById('totalHours').textContent;
            const totalEntries = document.getElementById('totalEntries').textContent;

            document.getElementById('printTotalHours').textContent = totalHours;
            document.getElementById('printTotalEntries').textContent = totalEntries;
            document.getElementById('printDate').textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            document.getElementById('printPreview').classList.add('active');
        }

        function closePrintPreview() {
            document.getElementById('printPreview').classList.remove('active');
        }

        loadEntries();
    </script>
</body>
</html>
