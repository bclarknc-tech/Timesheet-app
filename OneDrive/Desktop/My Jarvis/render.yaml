version: "1"
projects:
  - name: My project
    environments:
      - name: Production
        services:
          - type: web
            name: Timesheet-app
            runtime: python
            repo: https://github.com/bclarknc-tech/Timesheet-app
            plan: starter
            envVars:
              - key: Database_URL
            sync: false
            region: virginia
            buildCommand: pip install -r requirements.txt
            startCommand: gunicorn app:app
            autoDeployTrigger: commit
